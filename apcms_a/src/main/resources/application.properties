
# ==========================================
# Application / Server
# ==========================================
spring.application.name=apcms_a
spring.main.web-application-type=servlet

server.port=${SERVER_PORT:81}
server.servlet.context-path=/alpharking/admin

# ==========================================
# Oracle Database
# ==========================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@192.168.0.39:1521:xe}
spring.datasource.username=${DB_USERNAME:alpharking}
spring.datasource.password=${DB_PASSWORD:alpharking}

# ==========================================
# MyBatis
# ==========================================
mybatis.type-aliases-package=kr.co.alpharking.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.jdbc-type-for-null=null
mybatis.configuration.map-underscore-to-camel-case=true

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
spring.servlet.multipart.file-size-threshold=2KB

spring.servlet.multipart.location=${UPLOAD_PATH:./upload}

# ==========================================
# SMTP / Naver Mail
# ==========================================
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# Logging
# ==========================================
spring.output.ansi.enabled=always

# ==========================================
# AI Vision Fire / Smoke
# ==========================================
fire.alert.notification.type=${FIRE_ALERT_NOTIFICATION_TYPE:SAFETY_INCIDENT}
fire.alert.admin.status=${FIRE_ALERT_ADMIN_STATUS:ACTIVE}
fire.alert.risk.fire=${FIRE_ALERT_RISK_FIRE:HIGH}
fire.alert.risk.smoke=${FIRE_ALERT_RISK_SMOKE:MEDIUM}
fire.alert.allow.test=${FIRE_ALERT_ALLOW_TEST:false}

# ==========================================
# CORS
# ==========================================
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://192.168.0.13:3000,http://192.168.0.39:3000}
parking.websocket.allowed-origin-patterns=${PARKING_WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*:3000}

# Actuator 10/25
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# validation redis off
management.health.redis.enabled=false