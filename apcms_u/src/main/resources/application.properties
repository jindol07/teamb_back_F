spring.application.name=apcms_u
spring.main.web-application-type=servlet
server.port=80
server.servlet.context-path=/alpharking

#=== Datasource setting
spring.sql.init.platform=oracle
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@192.168.0.39:1521:xe}
# apply comment when finally deploying
spring.datasource.username=alpharking
spring.datasource.password=alpharking
# delete comment when finally deploying
#spring.datasource.username=${DB_USERNAME:alpharking}
#spring.datasource.password=${DB_PASSWORD:alpharking}

#sql mode
spring.sql.init.mode=never

#orm : hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=debug
spring.jpa.properties.hibernate.show_sql=true

# (update!) / create-drop
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.property-naming-strategy=SNAKE_CASE

#fileupload Configure
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
spring.servlet.multipart.file-size-threshold=2KB
#spring.servlet.multipart.location=D:\\ictstudy\\springboot\\workspace\\myictstudy0629\\src\\main\\resources\\static\\imgfile
# -v ~/upload:/app/upload  => docker volumn
spring.servlet.multipart.location=${UPLOAD_PATH:./upload}
#spring.servlet.multipart.location=/app/upload

#SMTP Mail Setting
spring.mail.host=smtp.naver.com
spring.mail.port=465
# spring.mail.username=YouEmail@naver.com
# spring.mail.password=YouEmailPWD
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=utf-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# when running local spring: localhost, when running Docker: redis => 10/17
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s

spring.output.ansi.enabled=always

# Shared notice attachment directory
notice.upload-dir=D:/finalProjectB/back/apcms_a/upload/notice

# AI Vision FastAPI server URL
ai.vision.base-url=${AI_VISION_BASE_URL:http://127.0.0.1:8001}

# AI parking recommendation FastAPI server URL
app.ai.recmn.base-url=${AI_RECMN_BASE_URL:http://127.0.0.1:8001}

# === APCMS authentication => 10/17
# without table Redis email authentication, using browsing Access JWT
app.mail.from=${MAIL_USERNAME:}
app.email.pepper=${EMAIL_CODE_PEPPER:}
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=apcms_u
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:3600}
app.auth.office-active-status=ACTIVE
app.auth.admin-active-status=ACTIVE
app.signup.vehicle-registration-type=INITIAL
app.signup.vehicle-status=APPROVED
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
app.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
# keep original spring.jackson.property-naming-strategy=SNAKE_CASE, changing at frontend/authApi
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
