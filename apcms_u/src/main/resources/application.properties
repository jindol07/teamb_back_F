
# ==========================================
# Application / Server
# ==========================================
spring.application.name=apcms_u
spring.main.web-application-type=servlet

server.port=${SERVER_PORT:80}
server.servlet.context-path=/alpharking

# ==========================================
# Oracle Database
# ==========================================
spring.sql.init.platform=oracle
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@192.168.0.39:1521:xe}
spring.datasource.username=${DB_USERNAME:alpharking}
spring.datasource.password=${DB_PASSWORD:alpharking}

spring.sql.init.mode=never

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.hibernate.type.descriptor.sql=${HIBERNATE_SQL_LOG_LEVEL:WARN}

spring.jackson.property-naming-strategy=SNAKE_CASE

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
spring.servlet.multipart.file-size-threshold=2KB

spring.servlet.multipart.location=${UPLOAD_PATH:./upload}

# ==========================================
# SMTP / Naver Mail
# ==========================================
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# Redis
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s

# ==========================================
# Logging
# ==========================================
spring.output.ansi.enabled=always

# ==========================================
# Shared Notice Upload
# ==========================================
notice.upload-dir=${NOTICE_UPLOAD_DIR:./upload/notice}

# ==========================================
# AI Vision / FastAPI
# ==========================================
ai.vision.base-url=${AI_VISION_BASE_URL:http://127.0.0.1:8001}

# ==========================================
# AI Parking Recommendation / FastAPI
# ==========================================
app.ai.recmn.base-url=${AI_RECMN_BASE_URL:http://127.0.0.1:8001}

# ==========================================
# APCMS Authentication
# ==========================================
app.mail.from=${MAIL_USERNAME:}
app.email.pepper=${EMAIL_CODE_PEPPER:}

app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=apcms_u
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:3600}

app.auth.office-active-status=ACTIVE
app.auth.admin-active-status=ACTIVE

app.signup.vehicle-registration-type=INITIAL
app.signup.vehicle-status=APPROVED

# ==========================================
# CORS
# ==========================================
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://192.168.0.39:3000,http://localhost:5173}
parking.websocket.allowed-origin-patterns=${PARKING_WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*:3000}

# ==========================================
# Kakao OAuth
# ==========================================
app.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
